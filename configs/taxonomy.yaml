# ---------------------------------------------------------------------------
# Taxonomy used by entity resolution (src/entities/).
#
# Matching rules:
# - brand aliases are matched as whole tokens on the folded title;
# - line/model aliases are matched on the "compact" title (only [a-z0-9]),
#   longest alias first, so "Infinity3" == "Infinity 3" and "EAGLEOC"
#   contains "eagle". Aliases of 3 characters or less must be whole tokens.
# - Order inside a list does not matter: longer aliases always win.
#
# Built from real titles of the 10 stores (2026-10). When a store publishes a
# new line, add it here and to tests/fixtures/resolution_gold.yaml.
# ---------------------------------------------------------------------------

conditions:
  open_box: ["open box", "openbox", "caja abierta", "exhibicion", "outlet"]
  used: ["usado", "usada", "usados", "usadas", "segunda mano", "new pulled", "pulled",
         "extraidas de equipos", "extraida de equipo", "seminuevo"]
  refurbished: ["reacondicionado", "reacondicionada", "refurbished", "refurb"]

# Titles in a store category that are not that kind of product.
rejects:
  gpu: ["riser", "soporte", "bracket", "backplate", "waterblock", "kit de iluminacion",
        "quadro"]
  cpu: ["pasta termica", "pasta", "cooler", "water cooling", "watercooling", "disipador termico",
        "ventilador", "kit de iluminacion"]
  ram: ["micro sd", "microsd", "pendrive", "kit de iluminacion", "light enhancement",
        "memoria usb", "flash"]
  ssd: ["disco duro", "hdd", "rpm", "purple", "skyhawk", "canvio", "lacie", "expansion",
        "elements", "bandeja", "gabinete", "nas", "memoria usb", "ssd flash", "pendrive",
        "ahv300", "hm800", "barracuda", "ironwolf", "wd red", "dock", "clonador",
        "duplicador", "caddy", "adaptador", "enclosure", "carry disk", "tarjeta para"]

