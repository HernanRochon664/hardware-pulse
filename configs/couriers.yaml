# ---------------------------------------------------------------------------
# Courier tariffs (US warehouse -> Uruguay) used by the import calculator.
#
# Only couriers whose tariff is published on their own site are listed
# (source_kind: official). Re-check them every couple of months: update the
# numbers, verified_at and the notes. The calculator warns when a tariff is
# older than 60 days.
#
# Weight bands:
#   flat_usd     a fixed price, matched on the real weight (e.g. "1 to 899 g")
#   per_kg_usd   price per kg of the whole chargeable weight, matched on the
#                weight rounded up to weight_step_kg
# tfspu_rate:   Tasa de Financiamiento del Servicio Postal Universal (Ley 19.009
#               art. 15): 10% of the courier's service price, IVA excluded.
#               tfspu_on_handling says whether the courier applies it to the
#               handling fee too (Urubox and Aerobox state "del flete").
# sales_tax_rate: of the county where the warehouse is (Miami-Dade: 6% state +
#               1% county surtax). tax_free_certificate: the courier provides a
#               Florida forwarding agent certificate (DR-14 FAA) that removes the
#               sales tax at stores with an exemption program (Amazon ATEP, eBay,
#               Best Buy, Newegg, B&H).
# ---------------------------------------------------------------------------

couriers:
  gripper:
    name: Gripper
    site: https://www.gripper.com.uy
    source_url: https://www.gripper.com.uy/tarifas
    source_kind: official
    verified_at: 2026-10-16
    warehouse: Opa-locka, FL (Miami-Dade)
    sales_tax_rate: 0.07
