# ---------------------------------------------------------------------------
# Stores tracked by Hardware Pulse.
#
# platform:
#   woocommerce  -> WooCommerce Store API (JSON). Category entries are category
#                   slugs; children are included by the API. "search:<text>"
#                   uses a full-text search instead (for stores without a
#                   component category tree).
#   sme          -> PCCompu/HardPC/Infinit e-commerce platform (HTML). Entries
#                   are category paths, exactly as linked from the store menu.
#   nopcommerce  -> nopCommerce (HTML). Entries are category paths.
#
# Prices are published in USD with IVA included by every store below
# (verified on 2026-10-14); tax_included is kept explicit for future stores.
# Use `python -m src.cli discover-categories <store>` to inspect a store.
#
# Motherboard, cooler, psu, case and monitor sources were added on 2026-10-16
# (only categories with 10+ products per store: a small source that empties
# out marks the run as degraded). A URL listed in two categories of one store
# is kept in the first one, in the order of src/domain/models.py:Category.
# ---------------------------------------------------------------------------

defaults:
  request_delay: 1.5
  timeout: 30
  max_pages: 60

stores:
  thot:
    name: Thot Computación
    base_url: https://thotcomputacion.com.uy
    platform: woocommerce
    categories:
      gpu: [tarjetas-de-video]
      cpu: [procesadores]
      ram: [memorias]
      ssd: [discos-ssd, ssd-m-2, discos-externos]
      motherboard: [motherboards]
      cooler: [cooling]
      psu: [fuentes]
      case: [gabinetes]
      monitor: [monitores]

  laaca:
    name: Laaca
    base_url: https://laaca.com.uy
    platform: woocommerce
    categories:
      gpu: [tarjetas-de-video]
      cpu: [amd, intel]
      ram: [memoria-ram]
      ssd: [solidos-ssd]
      motherboard: [placas-madre]
      cooler: [coolers, water-cooling-procesadores]
      psu: [fuentes]
      case: [gabinetes]
      monitor: [monitores-monitores]

  netpc:
    name: NetPC
    base_url: https://netpc.uy
    platform: woocommerce
    categories:
      gpu: ["search:tarjeta de video"]

  obsidian:
    name: Obsidian
    base_url: https://obsidian.uy
    platform: woocommerce
    categories:
      gpu: [tarjetas-graficas-nuevas]
      cpu: [cpu]

  pcparts:
    name: PCParts
    base_url: https://pcparts.com.uy
    platform: woocommerce
    categories:
      gpu: [gpu]
      cpu: [cpu]
      ssd: [ssds]
      motherboard: [motherboards]
      cooler: [fans-y-coolers]
      psu: [fuentes-de-poder]
      case: [gabinetes]
      monitor: [monitores]

  tecnocity:
    name: Tecnocity
    base_url: https://tecnocity.com.uy
    platform: woocommerce
    categories:
      gpu: [tarjetas-de-video]
      cpu: [cpu]
      ram: [memoria-ram]
      ssd: [discos]
      motherboard: [motherboards]
      cooler: [refrigeracion]
      psu: [fuentes]
      case: [gabinetes]
      monitor: [monitores]

  pccompu:
    name: PCCompu
    base_url: https://www.pccompu.com.uy
    platform: sme
    categories:
      gpu: [/catalogo/componentes/tarjetas-de-video/]
      cpu: [/catalogo/componentes/procesadores/]
      ram: [/catalogo/componentes/memoria-ram/]
      ssd:
        - /catalogo/componentes/almacenamiento/discos-solidos-ssd-y-m2/
        - /catalogo/accesorios/almacenamiento-externo/discos-externos/
      motherboard: [/catalogo/componentes/motherboard/]
      cooler:
        - /catalogo/componentes/refrigeracion-y-coolers/coolers-para-cpu/
        - /catalogo/componentes/refrigeracion-y-coolers/refrigeracion-liquida/
      psu: [/catalogo/componentes/fuentes-ups-y-reguladores/fuentes-para-pc/]
      case: [/catalogo/componentes/gabinetes/]
      monitor: [/catalogo/monitores/]

  hardpc:
    name: HardPC
    base_url: https://www.hardpc.com.uy
    platform: sme
    categories:
      gpu: [/catalogo/componentes/tarjeta-de-video/hardpc/]
      cpu: [/catalogo/componentes/procesadores/hardpc/]
      ram: [/catalogo/componentes/memorias/hardpc/]
      ssd: [/catalogo/componentes/discos/hardpc/]
      motherboard: [/catalogo/componentes/motherboard/hardpc/]
      psu: [/catalogo/componentes/fuentes/hardpc/]
      case: [/catalogo/componentes/gabinetes/hardpc/]
      monitor: [/catalogo/monitores/monitores/hardpc/]

  infinit:
    name: Infinit
    base_url: https://www.infinit.com.uy
    platform: sme
    categories:
      gpu: [/catalogo/hardware/tarjetas-graficas/infinit/]
      cpu: [/catalogo/hardware/procesadores/infinit/]
      ram: [/catalogo/hardware/memorias-ram/infinit/]
      ssd:
        - /catalogo/hardware/almacenamiento/solidos-ssd-nvme/infinit/
        - /catalogo/hardware/almacenamiento/discos-usb/infinit/
      motherboard: [/catalogo/hardware/motherboards/infinit/]
      cooler:
        - /catalogo/hardware/refrigeracion/ventiladores/infinit/
        - /catalogo/hardware/refrigeracion/ref-liquida/infinit/
      psu: [/catalogo/hardware/fuentes/infinit/]
      case: [/catalogo/hardware/gabinetes/infinit/]
      monitor:
        - /catalogo/gamer/monitores-gamer/infinit/
        - /catalogo/imagen-audio/monitores/infinit/

  banifox:
    name: Banifox
    base_url: https://www.banifox.com
    platform: nopcommerce
    # CloudFront answers HTTP 405 to GitHub Actions (datacenter) IPs since 2026-10-15,
    # while it works from a home connection. Disabled so scheduled runs stay green;
    # its history stays in the DB. Re-enable with a self-hosted runner if needed.
    enabled: false
    pause_reason: La tienda bloquea las lecturas automáticas desde servidores en la nube.
    categories:
      gpu: [/tarjetas-de-video]
      cpu: [/procesadores]
      ram: [/memorias-ram]
      ssd: [/ssd-m2-nvme, /ssd-2-5, /discos-externos-usb-usb-c]
